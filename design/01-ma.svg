<svg xmlns="http://www.w3.org/2000/svg" width="820" height="900" viewBox="0 0 820 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#CDEBD3"/><stop offset=".5" stop-color="#2F6B3E"/><stop offset="1" stop-color="#CDEBD3"/>
    </linearGradient>
  </defs>
  <rect width="820" height="900" fill="#E7EDE9"/>
  <text x="60" y="52" font-size="24" font-weight="700" fill="#0F1F14">01 · „Ma” képernyő — átdolgozva</text>
  <text x="60" y="78" font-size="14" fill="#4D6153">3 fül · élő állapot-chip · egy fő ajánlás · képernyő-óra hozzáférhető</text>

  <!--==== telefon ====-->
  <g transform="translate(240,100)">
    <rect x="0" y="0" width="360" height="700" rx="36" fill="#FFFFFF" stroke="#D8E6DB" stroke-width="2"/>
    <rect x="0" y="0" width="360" height="700" rx="36" fill="none" stroke="#0F1F14" stroke-opacity=".06" stroke-width="8"/>

    <!-- fejléc -->
    <text x="24" y="64" font-size="26" font-weight="800" fill="#0F1F14" letter-spacing="-.5">Szervóra</text>
    <text x="24" y="82" font-size="12" fill="#4D6153">Péntek · 01:38</text>
    <rect x="302" y="38" width="34" height="34" rx="17" fill="#EAF3EC"/>
    <text x="319" y="60" font-size="14" text-anchor="middle" fill="#2F6B3E">⚙</text>
    <rect x="256" y="38" width="42" height="34" rx="17" fill="#2F6B3E"/>
    <text x="277" y="59" font-size="11" font-weight="700" text-anchor="middle" fill="#FFFFFF">⏻ óra</text>

    <!-- nap-szalag (ív) -->
    <path d="M 30 190 A 150 150 0 0 1 330 190" fill="none" stroke="url(#belt)" stroke-width="34" stroke-linecap="round"/>
    <circle cx="185" cy="146" r="8" fill="#FFFFFF" stroke="#0F1F14" stroke-width="3"/>
    <text x="185" y="172" font-size="11" font-weight="700" text-anchor="middle" fill="#2F6B3E" letter-spacing="1">MOST · FA</text>
    <text x="185" y="204" font-size="34" font-weight="800" text-anchor="middle" fill="#0F1F14" letter-spacing="-1">Máj</text>
    <text x="185" y="226" font-size="12" text-anchor="middle" fill="#4D6153">01:00–03:00 · még 1 ó 22 perc</text>

    <!-- élő állapot chip (check-in visszajelzés) -->
    <g transform="translate(24,246)">
      <rect width="312" height="44" rx="22" fill="#CDEBD3"/>
      <circle cx="22" cy="22" r="6" fill="#2F6B3E"/>
      <text x="36" y="27" font-size="13" font-weight="600" fill="#0F1F14">Mentve 22:41 · Rendben · Nyugodt ✓</text>
      <text x="290" y="27" font-size="12" fill="#2F6B3E">↺</text>
    </g>

    <!-- fő ajánlás -->
    <g transform="translate(24,302)">
      <rect width="312" height="148" rx="24" fill="#EAF3EC"/>
      <text x="20" y="34" font-size="11" font-weight="700" fill="#2F6B3E" letter-spacing=".8">MOST ENNYI ELÉG</text>
      <text x="20" y="64" font-size="20" font-weight="800" fill="#0F1F14" letter-spacing="-.3">Lecsendesedés alvás előtt</text>
      <text x="20" y="88" font-size="14" fill="#4D6153">Lassú nyomás fentről lefelé, hosszabb kilégzéssel.</text>
      <text x="20" y="106" font-size="14" fill="#4D6153">Utána már ne nézz képernyőt.</text>
      <rect x="20" y="116" width="150" height="20" rx="10" fill="#FFFFFF"/>
      <text x="88" y="130" font-size="11" font-weight="700" text-anchor="middle" fill="#2F6B3E">INDÍTÁS · 5 PERC</text>
      <text x="184" y="131" font-size="12" font-weight="600" fill="#4D6153">→ csukott szemmel is</text>
    </g>

    <!-- később ma -->
    <text x="24" y="486" font-size="14" font-weight="700" fill="#0F1F14">Később ma</text>
    <g transform="translate(24,496)">
      <rect width="150" height="52" rx="14" fill="#FFFFFF" stroke="#D8E6DB"/>
      <text x="14" y="20" font-size="11" fill="#4D6153">03:00 · Fém</text>
      <text x="14" y="40" font-size="14" font-weight="700" fill="#0F1F14">Tüdő</text>
    </g>
    <g transform="translate(186,496)">
      <rect width="150" height="52" rx="14" fill="#FFFFFF" stroke="#D8E6DB"/>
      <text x="14" y="20" font-size="11" fill="#4D6153">05:00 · Fém</text>
      <text x="14" y="40" font-size="14" font-weight="700" fill="#0F1F14">Vastagbél</text>
    </g>

    <!-- alsó nav: 3 fül -->
    <g transform="translate(12,606)">
      <rect width="336" height="70" rx="26" fill="#FFFFFF" stroke="#D8E6DB"/>
      <rect x="14" y="14" width="102" height="42" rx="18" fill="#CDEBD3"/>
      <text x="65" y="32" font-size="14" text-anchor="middle" fill="#2F6B3E">☀</text>
      <text x="65" y="48" font-size="11" font-weight="700" text-anchor="middle" fill="#0F1F14">Ma</text>
      <text x="172" y="34" font-size="14" text-anchor="middle" fill="#4D6153">Ψ</text>
      <text x="172" y="50" font-size="11" font-weight="600" text-anchor="middle" fill="#4D6153">Test · Tudás</text>
      <text x="288" y="34" font-size="14" text-anchor="middle" fill="#4D6153">▤</text>
      <text x="288" y="50" font-size="11" font-weight="600" text-anchor="middle" fill="#4D6153">Napló</text>
    </g>
  </g>

  <!-- magyarázó jegyzetek -->
  <g transform="translate(20,120)" font-size="12" fill="#4D6153">
    <g stroke="#8AA894" stroke-width="1">
    </g>
    <circle cx="8" cy="6" r="4" fill="#2F6B3E"/><text x="20" y="10" font-weight="700" fill="#0F1F14">3 fül</text>
    <text x="60" y="10">»Ma«, »Test·Tudás«, »Napló« — a Gyakorlat nem külön fül, a Ma CTA-járól nyílik</text>
    <circle cx="8" cy="30" r="4" fill="#2F6B3E"/><text x="20" y="34" font-weight="700" fill="#0F1F14">Állapot-chip</text>
    <text x="104" y="34">a check-in eredménye látszik azonnal, módosítható egy koppintással</text>
    <circle cx="8" cy="54" r="4" fill="#2F6B3E"/><text x="20" y="58" font-weight="700" fill="#0F1F14">Képernyő-óra</text>
    <text x="128" y="58">a fejlécből, felirattal — nem csak rejtett ikon</text>
  </g>
</svg>
